<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>독일 선거 방송 그래픽 시뮬레이터 (ARD / ZDF)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas 라이브러리 (스크린샷 이미지 저장용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+KR:wght@400;600;700;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-num {
      font-family: 'Oswald', 'Chakra Petch', sans-serif;
    }
    .font-ard-logo {
      font-family: 'Oswald', sans-serif;
    }
    /* ARD 배경 (하늘색/블루 그라데이션) */
    .bg-ard {
      background: radial-gradient(ellipse at 50% 40%, #4a98d9 0%, #206db3 55%, #155594 85%, #0f4070 100%);
    }
    /* ZDF 배경 (깊은 딥 네이비) */
    .bg-zdf {
      background: radial-gradient(circle at 50% 30%, #254465 0%, #172b43 55%, #0f1c2d 100%);
    }
    .screen-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(15, 23, 42, 0.6);
    }
    /* PPT 닦아내기(Wipe Up) 효과 */
    .wipe-up-transition {
      transition: height 0.85s cubic-bezier(0.16, 1, 0.3, 1), clip-path 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased select-none">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 sticky top-0 z-50 flex flex-wrap items-center justify-between gap-3 shadow-md">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
        <span class="font-bold text-[11px] uppercase tracking-wider text-slate-300">LIVE SYSTEM</span>
      </div>
      <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
        독일 선거 방송 시뮬레이터
      </h1>
    </div>

    <!-- 상단 툴바: 방송국 / 모드 / 사진저장 -->
    <div class="flex items-center gap-2 flex-wrap">
      <!-- 방송국 탭 -->
      <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex text-xs font-bold">
        <button id="btn-station-ard" onclick="setStation('ARD')" class="px-3 py-1.5 rounded transition-all bg-sky-600 text-white shadow">
          ARD (Das Erste)
        </button>
        <button id="btn-station-zdf" onclick="setStation('ZDF')" class="px-3 py-1.5 rounded transition-all text-slate-300 hover:text-white">
          ZDF
        </button>
      </div>

      <!-- 그래픽 모드 탭 -->
      <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex text-xs font-bold">
        <button id="btn-view-bar" onclick="setViewMode('bar')" class="px-3 py-1.5 rounded transition-all bg-blue-600 text-white shadow">
          득표율 (Prognose / Hochrechnung)
        </button>
        <button id="btn-view-seats" onclick="setViewMode('seats')" class="px-3 py-1.5 rounded transition-all text-slate-300 hover:text-white">
          의석수 (Sitzverteilung)
        </button>
      </div>

      <!-- 사진 저장 -->
      <button id="btn-capture" onclick="captureScreen()" class="bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white px-3 py-1.5 rounded-lg border border-emerald-600 text-xs font-semibold flex items-center gap-1.5 transition shadow">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>사진 저장</span>
      </button>

      <!-- 전체화면 -->
      <button onclick="toggleFullScreen()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-semibold flex items-center gap-1.5 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
        <span class="hidden sm:inline">전체화면</span>
      </button>
    </div>
  </header>

  <!-- 메인 레이아웃 (컨트롤 패널 + 실제 방송 스크린) -->
  <main class="flex-1 flex flex-col lg:flex-row p-3 md:p-5 gap-5 max-w-[1920px] w-full mx-auto">
    
    <!-- 좌측 제어판 -->
    <aside class="w-full lg:w-96 flex-shrink-0 flex flex-col gap-3.5 bg-slate-900/95 border border-slate-800 rounded-xl p-4 shadow-xl backdrop-blur">
      
      <!-- 시뮬레이션 제어 -->
      <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">방송 발표 제어</span>
          <span id="anim-status-badge" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-semibold">대기 중</span>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-play" onclick="startBroadcastAnimation()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition text-white text-xs font-bold py-2 px-3 rounded flex items-center justify-center gap-1.5 shadow">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
            발표 시작
          </button>
          <button onclick="resetAnimation()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-300 text-xs font-semibold py-2 px-3 rounded flex items-center justify-center gap-1.5 border border-slate-700">
            초기화
          </button>
        </div>

        <div class="space-y-2 pt-1 border-t border-slate-800 text-xs">
          <div class="flex items-center justify-between">
            <label class="text-slate-400 font-medium">발표 순서</label>
            <select id="order-mode" onchange="changeOrderMode()" class="bg-slate-900 border border-slate-700 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none">
              <option value="custom" selected>추가/정렬 순서대로 (기본)</option>
              <option value="votes">득표율 높은 순</option>
              <option value="all">전체 동시 발표</option>
            </select>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1">
              <label class="text-slate-400 font-medium">발표 간 대기 시간</label>
              <span id="delay-label" class="font-bold text-sky-400">1.2초</span>
            </div>
            <input type="range" id="delay-slider" min="0.4" max="3.0" step="0.2" value="1.2" oninput="updateDelay(this.value)" class="w-28 accent-sky-500 cursor-pointer">
          </div>
        </div>
      </div>

      <!-- 메타 정보 설정 -->
      <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2 text-xs">
        <div class="font-bold text-slate-300 flex items-center justify-between">
          <span>방송 텍스트 설정</span>
          <button onclick="resetDefaults()" class="text-[11px] text-sky-400 hover:underline">기본값 복원</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">선거 타이틀</label>
            <input type="text" id="meta-title" value="Wahl 2026" oninput="renderScreen()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">지역 / 연방주</label>
            <input type="text" id="meta-region" value="Sachsen-Anhalt" oninput="renderScreen()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">발표 시각/유형</label>
            <input type="text" id="meta-time" value="Hochrechnung 23:22 Uhr" oninput="renderScreen()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">총 의석수 (Sitze)</label>
            <input type="number" id="meta-total-seats" value="83" oninput="renderScreen()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs">
          </div>
        </div>
      </div>

      <!-- 정당 목록 -->
      <div class="flex-1 flex flex-col min-h-0 bg-slate-950 p-3 rounded-lg border border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="font-bold text-xs text-slate-300">정당 데이터 (<span id="party-count">8</span>)</span>
          <button onclick="addNewPartyModal()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs px-2.5 py-1 rounded transition">
            + 정당 추가
          </button>
        </div>

        <div id="party-list-container" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-[340px]">
          <!-- 정당 동적 목록 -->
        </div>
      </div>
    </aside>

    <!-- 우측 메인 송출 스크린 -->
    <section class="flex-1 flex flex-col items-center justify-center min-h-[520px] w-full">
      <div id="broadcast-screen" class="relative w-full max-w-[1240px] aspect-[16/9] overflow-hidden screen-shadow rounded-sm bg-ard flex flex-col justify-between p-6 md:p-10 select-none">
        
        <!-- ======================= 상단 헤더 ======================= -->
        <div id="screen-header" class="relative z-10">
          
          <!-- ARD 헤더 (1번/4번 사진과 100% 동일) -->
          <div id="header-ard" class="flex flex-col gap-1.5">
            <!-- 상단 바 -->
            <div class="flex items-center justify-between bg-gradient-to-r from-blue-900/90 via-blue-800/80 to-slate-900/90 rounded-sm px-3.5 py-1.5 border-b border-white/20 shadow-sm">
              <div class="flex items-center gap-2">
                <span class="font-black text-2xl md:text-3xl text-white tracking-tighter uppercase">WAHL</span>
                <span id="disp-ard-year" class="font-bold text-xl md:text-2xl text-white/95 border-l-2 border-white/40 pl-2">2026</span>
              </div>
              <div class="flex items-center gap-3">
                <span id="disp-ard-region" class="text-sm md:text-lg font-bold text-white tracking-wide">Sachsen-Anhalt</span>
                <!-- ARD 원형 로고 (1) -->
                <div class="w-6 h-6 md:w-8 md:h-8 rounded-full border-2 border-white/90 flex items-center justify-center font-bold text-xs md:text-sm text-white font-ard-logo">
                  1
                </div>
              </div>
            </div>

            <!-- 서브 바 (Prognose & in %) -->
            <div class="flex items-center justify-between bg-white/20 backdrop-blur-md rounded-sm px-3.5 py-1 text-white border border-white/10">
              <span id="disp-ard-subtitle" class="font-bold text-sm md:text-base tracking-tight text-white drop-shadow-sm">Prognose</span>
              <span id="disp-ard-unit" class="font-medium text-xs md:text-sm text-white/90">in %</span>
            </div>
          </div>

          <!-- ZDF 헤더 (2번/3번 사진과 100% 동일) -->
          <div id="header-zdf" class="hidden flex items-start justify-between">
            <div class="flex items-center gap-4">
              <!-- ZDF 2DF 로고 -->
              <div class="w-12 h-7 md:w-16 md:h-9 bg-white/95 rounded-full flex items-center justify-center shadow">
                <span class="font-black text-slate-950 text-sm md:text-lg tracking-tighter">2DF</span>
              </div>
              <div>
                <h2 id="disp-zdf-title-box" class="text-xl md:text-3xl font-extrabold text-white tracking-tight flex items-center gap-2">
                  <span id="disp-zdf-time">Hochrechnung 23:22 Uhr</span>
                </h2>
                <!-- ZDF 시그니처 주황색 언더라인 -->
                <div class="h-1.5 w-24 bg-[#ff6600] mt-1 mb-0.5"></div>
                <div id="disp-zdf-unit" class="text-xs md:text-sm text-slate-300 font-medium">in Prozent</div>
              </div>
            </div>

            <!-- ZDF 우측 메타 타이틀 -->
            <div class="text-right border-l-2 border-white/30 pl-4 py-0.5">
              <div class="text-xl md:text-3xl font-black text-white tracking-wide leading-none">
                <span id="disp-zdf-title">Wahl2026</span>
              </div>
              <div id="disp-zdf-region" class="text-sm md:text-lg text-slate-200 font-semibold mt-1">
                Sachsen-Anhalt
              </div>
              <div id="disp-zdf-datetime" class="text-[10px] md:text-xs text-slate-400">
                06.09.2026, 23:24 Uhr
              </div>
            </div>
          </div>

        </div>

        <!-- ======================= 중앙 메인 그래픽 ======================= -->
        
        <!-- 1) 득표율 바 차트 모드 -->
        <div id="view-barchart" class="relative z-10 flex-1 flex flex-col justify-end w-full mt-2 pb-1">
          <!-- 차트 바 영역 (충분한 높이 확보) -->
          <div id="bars-container" class="w-full flex items-end justify-center gap-1.5 md:gap-3.5 h-[230px] md:h-[320px] lg:h-[360px]">
            <!-- JS 렌더링 -->
          </div>
        </div>

        <!-- 2) 의석수 다이어그램 모드 -->
        <div id="view-seatschart" class="hidden relative z-10 flex-1 flex flex-col items-center justify-between w-full mt-1">
          <div class="relative w-full max-w-[560px] aspect-[2/1] flex items-end justify-center">
            <svg id="parliament-svg" viewBox="0 0 400 210" class="w-full h-full filter drop-shadow-lg overflow-visible">
              <!-- 반원 아치 세그먼트 -->
            </svg>
            <div id="seats-center-badge" class="absolute bottom-0 flex flex-col items-center justify-center bg-slate-900/95 border-2 border-slate-700/90 rounded-t-full w-24 h-12 md:w-32 md:h-16 px-2">
              <span id="seats-center-total" class="font-num text-xl md:text-3xl font-black text-white leading-none">83</span>
              <span class="text-[9px] md:text-[11px] text-slate-300 uppercase tracking-wider font-bold">Sitze</span>
            </div>
          </div>

          <!-- 하단 의석수 테이블 -->
          <div id="seats-cards-container" class="w-full flex items-stretch justify-center gap-1.5 md:gap-3 px-2 pt-2">
            <!-- JS 렌더링 -->
          </div>
        </div>

        <!-- ======================= 하단 푸터 / 크레딧 ======================= -->
        <div class="relative z-10 flex items-center justify-between pt-2 text-[10px] md:text-xs text-white/70">
          <div id="disp-source" class="font-semibold text-white/80">
            infratest dimap
          </div>
          <div id="live-clock" class="font-mono text-white/50 text-[11px]">
            23:22:00
          </div>
        </div>

      </div>

      <div id="capture-toast" class="opacity-0 transition-opacity duration-300 mt-2 text-xs text-emerald-400 font-semibold h-4"></div>
    </section>
  </main>

  <!-- 정당 편집 모달 -->
  <div id="party-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-md p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <h3 id="modal-title" class="text-sm font-bold text-white">정당 추가 / 수정</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">정당 약칭 (Name)</label>
          <input type="text" id="modal-name" placeholder="예: AfD, CDU, SPD..." class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-bold focus:border-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">득표율 (%)</label>
            <input type="number" id="modal-percent" step="0.1" min="0" max="100" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-num font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">의석수 (석)</label>
            <input type="number" id="modal-seats" min="0" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-num font-bold focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">전회 대비 증감 (%p)</label>
            <input type="number" id="modal-diff" step="0.1" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-num font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">정당 색상</label>
            <div class="flex items-center gap-2">
              <input type="color" id="modal-color" class="w-9 h-8 bg-transparent border-0 rounded cursor-pointer">
              <input type="text" id="modal-color-hex" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-mono text-xs">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] mb-1">빠른 색상 선택</label>
          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="pickColor('#141414')" class="w-5 h-5 rounded-full bg-[#141414] border border-white/40" title="CDU (검정)"></button>
            <button onclick="pickColor('#005cb9')" class="w-5 h-5 rounded-full bg-[#005cb9] border border-white/40" title="AfD (파랑)"></button>
            <button onclick="pickColor('#009ee0')" class="w-5 h-5 rounded-full bg-[#009ee0] border border-white/40" title="AfD 라이트블루"></button>
            <button onclick="pickColor('#b83870')" class="w-5 h-5 rounded-full bg-[#b83870] border border-white/40" title="Linke (자주)"></button>
            <button onclick="pickColor('#d8232a')" class="w-5 h-5 rounded-full bg-[#d8232a] border border-white/40" title="SPD (빨강)"></button>
            <button onclick="pickColor('#f2c418')" class="w-5 h-5 rounded-full bg-[#f2c418] border border-white/40" title="FDP (노랑)"></button>
            <button onclick="pickColor('#7ab82e')" class="w-5 h-5 rounded-full bg-[#7ab82e] border border-white/40" title="Grüne (초록)"></button>
            <button onclick="pickColor('#611f44')" class="w-5 h-5 rounded-full bg-[#611f44] border border-white/40" title="BSW (보라)"></button>
            <button onclick="pickColor('#858c93')" class="w-5 h-5 rounded-full bg-[#858c93] border border-white/40" title="Andere (회색)"></button>
          </div>
        </div>
      </div>

      <input type="hidden" id="modal-edit-id">

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal()" class="px-3 py-1.5 rounded text-slate-400 hover:text-white font-medium text-xs">취소</button>
        <button onclick="saveParty()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-1.5 rounded">저장</button>
      </div>
    </div>
  </div>

  <script>
    // 첨부해주신 사진과 일치하는 정확한 독일 주 선거 정당 데이터
    const DEFAULT_PARTIES = [
      { id: '1', name: 'CDU', percent: 18.5, seats: 15, diff: -18.6, color: '#111317' },
      { id: '2', name: 'AfD', percent: 44.5, seats: 39, diff: 23.7, color: '#004ca8' },
      { id: '3', name: 'Linke', percent: 9.5, seats: 8, diff: -1.5, color: '#b53b75' },
      { id: '4', name: 'SPD', percent: 8.0, seats: 8, diff: -0.4, color: '#d42127' },
      { id: '5', name: 'FDP', percent: 2.0, seats: 0, diff: -4.4, color: '#f3c316' },
      { id: '6', name: 'Grüne', percent: 9.0, seats: 8, diff: 3.1, color: '#7bb336' },
      { id: '7', name: 'BSW', percent: 5.0, seats: 5, diff: 5.0, color: '#631d45' },
      { id: '8', name: 'Andere', percent: 3.5, seats: 0, diff: -6.8, color: '#7e8790' }
    ];

    let parties = JSON.parse(JSON.stringify(DEFAULT_PARTIES));
    let currentStation = 'ARD'; // 초기 방송국: ARD
    let currentView = 'bar';     // 'bar' or 'seats'
    let orderMode = 'custom';    // 'custom', 'votes', 'all'
    let stepDelay = 1.2;
    let isBroadcasting = false;
    let animationTimers = [];

    // 공개된 정당 ID Set (초기에는 모두 표시)
    let revealedParties = new Set(parties.map(p => p.id));

    /* ====================================================================
       방송국 및 모드 전환
       ==================================================================== */
    function setStation(station) {
      currentStation = station;
      const btnArd = document.getElementById('btn-station-ard');
      const btnZdf = document.getElementById('btn-station-zdf');
      const screen = document.getElementById('broadcast-screen');
      const headerArd = document.getElementById('header-ard');
      const headerZdf = document.getElementById('header-zdf');
      const dispSource = document.getElementById('disp-source');

      if (station === 'ARD') {
        btnArd.className = "px-3 py-1.5 rounded transition-all bg-sky-600 text-white shadow";
        btnZdf.className = "px-3 py-1.5 rounded transition-all text-slate-300 hover:text-white";
        screen.classList.remove('bg-zdf');
        screen.classList.add('bg-ard');
        headerArd.classList.remove('hidden');
        headerZdf.classList.add('hidden');
        dispSource.innerText = "infratest dimap";
      } else {
        btnZdf.className = "px-3 py-1.5 rounded transition-all bg-amber-500 text-slate-950 font-black shadow";
        btnArd.className = "px-3 py-1.5 rounded transition-all text-slate-300 hover:text-white";
        screen.classList.remove('bg-ard');
        screen.classList.add('bg-zdf');
        headerZdf.classList.remove('hidden');
        headerArd.classList.add('hidden');
        dispSource.innerText = "Quelle: Forschungsgruppe Wahlen";
      }
      renderScreen();
    }

    function setViewMode(mode) {
      currentView = mode;
      const btnBar = document.getElementById('btn-view-bar');
      const btnSeats = document.getElementById('btn-view-seats');
      const viewBar = document.getElementById('view-barchart');
      const viewSeats = document.getElementById('view-seatschart');
      const ardSub = document.getElementById('disp-ard-subtitle');
      const ardUnit = document.getElementById('disp-ard-unit');
      const zdfUnit = document.getElementById('disp-zdf-unit');
      const totalSeatsVal = document.getElementById('meta-total-seats').value || 83;

      if (mode === 'bar') {
        btnBar.className = "px-3 py-1.5 rounded transition-all bg-blue-600 text-white shadow";
        btnSeats.className = "px-3 py-1.5 rounded transition-all text-slate-300 hover:text-white";
        viewBar.classList.remove('hidden');
        viewSeats.classList.add('hidden');
        ardSub.innerText = "Prognose";
        ardUnit.innerText = "in %";
        zdfUnit.innerText = "in Prozent";
      } else {
        btnSeats.className = "px-3 py-1.5 rounded transition-all bg-blue-600 text-white shadow";
        btnBar.className = "px-3 py-1.5 rounded transition-all text-slate-300 hover:text-white";
        viewBar.classList.add('hidden');
        viewSeats.classList.remove('hidden');

        ardUnit.innerText = totalSeatsVal + " Sitze";
        zdfUnit.innerText = "Sitze gesamt: " + totalSeatsVal;

      renderScreen();
    }

    function updateDelay(val) {
      stepDelay = parseFloat(val);
      document.getElementById('delay-label').innerText = val + '초';
    }

    function changeOrderMode() {
      orderMode = document.getElementById('order-mode').value;
      resetAnimation();
    }

    /* ====================================================================
       정당 리스트 UI 및 커스텀
       ==================================================================== */
    function renderPartyList() {
      const container = document.getElementById('party-list-container');
      container.innerHTML = '';

      parties.forEach((party, index) => {
        const card = document.createElement('div');
        card.className = "flex items-center justify-between p-2 rounded bg-slate-900 border border-slate-800 text-xs";
        card.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-slate-500 font-mono text-[11px] w-3">${index + 1}</span>
            <span class="w-3 h-5 rounded-sm" style="background-color: ${party.color};"></span>
            <div class="truncate">
              <span class="font-bold text-slate-200">${party.name}</span>
              <span class="text-slate-400 text-[11px] ml-1.5 font-num">${party.percent.toFixed(1)}% (${party.seats}석)</span>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="moveParty(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1 text-slate-400 hover:text-white disabled:opacity-20 text-[10px]">▲</button>
            <button onclick="moveParty(${index}, 1)" ${index === parties.length - 1 ? 'disabled' : ''} class="p-1 text-slate-400 hover:text-white disabled:opacity-20 text-[10px]">▼</button>
            <button onclick="editParty('${party.id}')" class="px-1 py-0.5 text-sky-400 hover:text-sky-300 text-[11px]">수정</button>
            <button onclick="deleteParty('${party.id}')" class="px-1 py-0.5 text-rose-400 hover:text-rose-300 text-[11px]">삭제</button>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('party-count').innerText = parties.length;
    }

    function moveParty(index, delta) {
      const newIndex = index + delta;
      if (newIndex < 0 || newIndex >= parties.length) return;
      const item = parties.splice(index, 1)[0];
      parties.splice(newIndex, 0, item);
      renderPartyList();
      renderScreen();
    }

    function deleteParty(id) {
      if (parties.length <= 2) {
        return;
      }
      parties = parties.filter(p => p.id !== id);
      revealedParties.delete(id);
      renderPartyList();
      renderScreen();
    }

    function addNewPartyModal() {
      document.getElementById('modal-title').innerText = "새 정당 추가";
      document.getElementById('modal-edit-id').value = "";
      document.getElementById('modal-name').value = "";
      document.getElementById('modal-percent').value = "5.0";
      document.getElementById('modal-seats').value = "5";
      document.getElementById('modal-diff').value = "0.0";
      document.getElementById('modal-color').value = "#005cb9";
      document.getElementById('modal-color-hex').value = "#005cb9";
      document.getElementById('party-modal').classList.remove('hidden');
    }

    function editParty(id) {
      const p = parties.find(item => item.id === id);
      if (!p) return;
      document.getElementById('modal-title').innerText = "정당 정보 수정";
      document.getElementById('modal-edit-id').value = p.id;
      document.getElementById('modal-name').value = p.name;
      document.getElementById('modal-percent').value = p.percent;
      document.getElementById('modal-seats').value = p.seats;
      document.getElementById('modal-diff').value = p.diff;
      document.getElementById('modal-color').value = p.color;
      document.getElementById('modal-color-hex').value = p.color;
      document.getElementById('party-modal').classList.remove('hidden');
    }

    function pickColor(color) {
      document.getElementById('modal-color').value = color;
      document.getElementById('modal-color-hex').value = color;
    }

    document.getElementById('modal-color').addEventListener('input', (e) => {
      document.getElementById('modal-color-hex').value = e.target.value;
    });
    document.getElementById('modal-color-hex').addEventListener('input', (e) => {
      document.getElementById('modal-color').value = e.target.value;
    });

    function closeModal() {
      document.getElementById('party-modal').classList.add('hidden');
    }

    function saveParty() {
      const id = document.getElementById('modal-edit-id').value;
      const name = document.getElementById('modal-name').value.trim();
      const percent = parseFloat(document.getElementById('modal-percent').value) || 0;
      const seats = parseInt(document.getElementById('modal-seats').value) || 0;
      const diff = parseFloat(document.getElementById('modal-diff').value) || 0;
      const color = document.getElementById('modal-color').value || '#005cb9';

      if (!name) return;

      if (id) {
        const target = parties.find(p => p.id === id);
        if (target) {
          target.name = name;
          target.percent = percent;
          target.seats = seats;
          target.diff = diff;
          target.color = color;
        }
      } else {
        const newParty = {
          id: Date.now().toString(),
          name,
          percent,
          seats,
          diff,
          color
        };
        parties.push(newParty);
        revealedParties.add(newParty.id);
      }

      closeModal();
      renderPartyList();
      renderScreen();
    }

    /* ====================================================================
       화면 렌더링 (ARD 및 ZDF 정밀 디자인)
       ==================================================================== */
    function renderScreen() {
      const titleVal = document.getElementById('meta-title').value;
      const regionVal = document.getElementById('meta-region').value;
      const timeVal = document.getElementById('meta-time').value;
      const totalSeatsVal = parseInt(document.getElementById('meta-total-seats').value) || 83;

      // ZDF 메타 텍스트
      document.getElementById('disp-zdf-time').innerText = timeVal;
      document.getElementById('disp-zdf-title').innerText = titleVal.replace(/\s+/g, '');
      document.getElementById('disp-zdf-region').innerText = regionVal;

      // ARD 메타 텍스트
      document.getElementById('disp-ard-year').innerText = titleVal.replace(/[^0-9]/g, '') || "2026";
      document.getElementById('disp-ard-region').innerText = regionVal;

      if (currentView === 'bar') {
        renderBarChart();
      } else {
        renderSeatsChart(totalSeatsVal);
      }
    }

    // 1) 득표율 바 차트 렌더링
    function renderBarChart() {
      const container = document.getElementById('bars-container');
      container.innerHTML = '';
      if (parties.length === 0) return;

      // 최대 득표율 기준으로 상대 높이(최소 50% 스케일)
      const maxVal = Math.max(...parties.map(p => p.percent), 48);

      parties.forEach(party => {
        const isRevealed = revealedParties.has(party.id);
        // 바가 차지할 수직 비율 (상단 88% 기준)
        const heightPercent = Math.max((party.percent / maxVal) * 88, 3);

        const col = document.createElement('div');
        col.className = "flex-1 flex flex-col justify-end items-stretch h-full max-w-[130px]";

        if (currentStation === 'ARD') {
          // ==================== ARD 스타일 (사진 1) ====================
          col.innerHTML = `
            <!-- 바 영역 -->
            <div class="w-full flex-1 flex flex-col justify-end items-center px-0.5 relative">

              </div>

              <!-- 상단 정당 컬러 띠 -->

              <!-- 1행: 정당명 -->

                ${party.name}
              </div>
              <!-- 2행: 득표율 -->
              <div class="py-0.5 font-num font-bold text-sm md:text-xl lg:text-2xl text-slate-950 border-t border-slate-200">
                ${isRevealed ? party.percent.toFixed(1).replace('.', ',') : '—'}
              </div>
              <!-- 3행: 전회 대비 증감 (%p) -->

                <!-- 상단 화이트 캡 -->

            </div>

            <!-- 하단 2단 정보 테이블 (ZDF) -->
            <div class="w-full bg-white text-slate-900 rounded-sm shadow-md overflow-hidden mt-1 flex flex-col text-center">
              <!-- 상단: 큰 득표율 숫자 -->
              <div class="py-1.5 px-0.5 font-num font-black text-base md:text-2xl lg:text-3xl text-slate-950 leading-none tracking-tight">
                ${isRevealed ? party.percent.toFixed(1).replace('.', ',') : '—'}
              </div>
              <!-- 중간 정당 구분 컬러 라인 -->

    // 2) 의석수 다이어그램 렌더링
    function renderSeatsChart(totalSeats) {
      const svg = document.getElementById('parliament-svg');
      const cardsContainer = document.getElementById('seats-cards-container');
      const centerTotal = document.getElementById('seats-center-total');
      const centerBadge = document.getElementById('seats-center-badge');

      centerTotal.innerText = totalSeats;
      cardsContainer.innerHTML = '';
      svg.innerHTML = '';

      if (currentStation === 'ARD') {
        centerBadge.className = "absolute bottom-0 flex flex-col items-center justify-center bg-blue-900/90 border-2 border-sky-400/80 rounded-t-full w-24 h-12 md:w-32 md:h-16 px-2";
      } else {
        centerBadge.className = "absolute bottom-0 flex flex-col items-center justify-center bg-slate-900/95 border-2 border-slate-700/90 rounded-t-full w-24 h-12 md:w-32 md:h-16 px-2";
      }

      const cx = 200, cy = 200, outerR = 175, innerR = 90;
      const activeParties = parties.filter(p => p.seats > 0);
      const calculatedTotal = activeParties.reduce((sum, p) => sum + p.seats, 0) || totalSeats;

      let currentAngle = Math.PI;

      activeParties.forEach(party => {
        const isRevealed = revealedParties.has(party.id);
        const seatRatio = party.seats / calculatedTotal;
        const angleSpan = seatRatio * Math.PI;
        const nextAngle = currentAngle - angleSpan;

        const x1 = cx + outerR * Math.cos(currentAngle);
        const y1 = cy - outerR * Math.sin(currentAngle);
        const x2 = cx + outerR * Math.cos(nextAngle);
        const y2 = cy - outerR * Math.sin(nextAngle);

        const ix1 = cx + innerR * Math.cos(nextAngle);
        const iy1 = cy - innerR * Math.sin(nextAngle);
        const ix2 = cx + innerR * Math.cos(currentAngle);
        const iy2 = cy - innerR * Math.sin(currentAngle);

        const largeArc = angleSpan > Math.PI ? 1 : 0;

        const pathData = `
          M ${x1} ${y1}
          A ${outerR} ${outerR} 0 ${largeArc} 1 ${x2} ${y2}
          L ${ix1} ${iy1}
          A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix2} ${iy2}
          Z
        `;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('fill', isRevealed ? party.color : '#1e293b');
        path.setAttribute('stroke', '#ffffff');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('class', 'transition-all duration-700 ease-out');
        svg.appendChild(path);

        currentAngle = nextAngle;
      });

      // 하단 의석수 카드 (사진 3 / 사진 4와 일치)
      parties.forEach(party => {
        const isRevealed = revealedParties.has(party.id);
        const card = document.createElement('div');
        card.className = "flex-1 max-w-[130px] rounded-sm overflow-hidden text-center shadow transition-all duration-500";

        if (currentStation === 'ZDF') {
          // 사진 3 스타일
          card.innerHTML = `
            <div class="bg-white py-1.5 px-1 border-b-2" style="border-color: ${party.color};">
              <div class="font-num font-black text-base md:text-2xl text-slate-950 leading-none">
                ${isRevealed ? party.seats : '—'}
              </div>
            </div>
            <div class="bg-slate-100 py-1 text-slate-800 font-bold text-xs md:text-sm truncate">
              ${party.name}
            </div>
          `;
        } else {
          // 사진 4 스타일 (ARD)
          card.innerHTML = `
            <div class="h-1.5 w-full" style="background-color: ${party.color};"></div>
            <div class="bg-white py-1 px-1 border-b border-slate-200">
              <div class="font-bold text-xs md:text-sm text-slate-800 truncate">${party.name}</div>
              <div class="font-num font-black text-sm md:text-xl text-slate-950 leading-none mt-0.5">
                ${isRevealed ? party.seats : '—'}
              </div>
            </div>
          `;
        }

        cardsContainer.appendChild(card);
      });
    }

    /* ====================================================================
       순차 발표 시뮬레이션 (사운드 없이 깔끔한 애니메이션)
       ==================================================================== */
    function clearAllTimers() {
      animationTimers.forEach(t => clearTimeout(t));
      animationTimers = [];
      isBroadcasting = false;
      const statusBadge = document.getElementById('anim-status-badge');
      statusBadge.innerText = "대기 중";
      statusBadge.className = "text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-semibold";
      document.getElementById('btn-play').innerHTML = `
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
        발표 시작
      `;
    }

    function resetAnimation() {
      clearAllTimers();
      revealedParties.clear();
      renderScreen();
    }

    function startBroadcastAnimation() {
      if (isBroadcasting) {
        clearAllTimers();
        return;
      }

      revealedParties.clear();
      renderScreen();

      isBroadcasting = true;
      const statusBadge = document.getElementById('anim-status-badge');
      statusBadge.innerText = "송출 중";
      statusBadge.className = "text-[11px] px-2 py-0.5 rounded-full bg-blue-600 text-white font-bold animate-pulse";
      document.getElementById('btn-play').innerHTML = `
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        일시정지
      `;

      let sequenceParties = [...parties];
      if (orderMode === 'votes') {
        sequenceParties.sort((a, b) => b.percent - a.percent);
      } else if (orderMode === 'all') {
        sequenceParties.forEach(p => revealedParties.add(p.id));
        renderScreen();
        setTimeout(() => {
          clearAllTimers();
          statusBadge.innerText = "발표 완료";
          statusBadge.className = "text-[11px] px-2 py-0.5 rounded-full bg-emerald-600 text-white font-bold";
        }, 1000);
        return;
      }

      const baseDelay = 300;
      const stepMs = stepDelay * 1000;

      sequenceParties.forEach((party, idx) => {
        const timer = setTimeout(() => {
          revealedParties.add(party.id);
          renderScreen();

          if (idx === sequenceParties.length - 1) {
            setTimeout(() => {
              isBroadcasting = false;
              statusBadge.innerText = "발표 완료";
              statusBadge.className = "text-[11px] px-2 py-0.5 rounded-full bg-emerald-600 text-white font-bold";
              document.getElementById('btn-play').innerHTML = `
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
                재발표
              `;
            }, 800);
          }
        }, baseDelay + (idx * stepMs));

        animationTimers.push(timer);
      });
    }

    /* ====================================================================
       사진 저장 (Screenshot Capture: 풀화면 및 미발표 요소 전면 공개 캡처)
       ==================================================================== */
    function captureScreen() {
      const screenElem = document.getElementById('broadcast-screen');
      const toast = document.getElementById('capture-toast');
      const btnCapture = document.getElementById('btn-capture');

      btnCapture.disabled = true;
      btnCapture.classList.add('opacity-50');
      toast.innerText = "풀화면 그래픽 렌더링 및 캡처 중...";
      toast.classList.remove('opacity-0');

      // 1) 저장 시 아직 발표되지 않아 안 보이던 정당들도 모두 보이도록 전체 공개 상태로 임시 전환
      const prevRevealed = new Set(revealedParties);
      parties.forEach(p => revealedParties.add(p.id));
      
      // 애니메이션 대기 없이 즉각 화면 전체 표시
      renderScreen();

      setTimeout(() => {
        html2canvas(screenElem, {
          scale: 2,
          useCORS: true,
          backgroundColor: null,
          scrollX: 0,
          scrollY: 0,
          windowWidth: 1920,
          windowHeight: 1080,
          onclone: (clonedDoc) => {
            const clonedScreen = clonedDoc.getElementById('broadcast-screen');
            if (clonedScreen) {
              // 화면 잘림 방지: 1920x1080 풀 방송 해상도로 확장하여 구석의 로고/출처까지 완벽 캡처
              clonedScreen.style.width = '1920px';
              clonedScreen.style.height = '1080px';
              clonedScreen.style.maxWidth = '1920px';
              clonedScreen.style.maxHeight = '1080px';
              clonedScreen.style.borderRadius = '0px';
              clonedScreen.style.boxShadow = 'none';

              // 클론 내부 트랜지션 해제 (즉시 100% 바 표시 보장)
              clonedScreen.querySelectorAll('.wipe-up-transition').forEach(el => {
                el.style.transition = 'none';
              });
            }
          }
        }).then(canvas => {
          const link = document.createElement('a');
          const stationName = currentStation;
          const viewName = currentView === 'bar' ? 'Prognose' : 'Sitzverteilung';
          const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
          
          link.download = `${stationName}_${viewName}_FullHD_${timestamp}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();

          toast.innerText = "안 보이는 부분 없이 풀화면으로 사진이 저장되었습니다.";
          setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }).catch(err => {
          console.error(err);
          toast.innerText = "저장에 실패했습니다.";
          setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }).finally(() => {
          // 2) 캡처 완료 후 원래 진행 중이던 발표 상태로 복원
          revealedParties = prevRevealed;
          renderScreen();
          btnCapture.disabled = false;
          btnCapture.classList.remove('opacity-50');
        });
      }, 120);
    }

    function resetDefaults() {
      document.getElementById('meta-title').value = "Wahl 2026";
      document.getElementById('meta-region').value = "Sachsen-Anhalt";
      document.getElementById('meta-time').value = "Hochrechnung 23:22 Uhr";
      document.getElementById('meta-total-seats').value = "83";
      parties = JSON.parse(JSON.stringify(DEFAULT_PARTIES));
      revealedParties = new Set(parties.map(p => p.id));
      renderPartyList();
      renderScreen();
    }

    function toggleFullScreen() {
      const elem = document.getElementById('broadcast-screen');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    // 시계 갱신
    setInterval(() => {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    window.onload = function() {
      renderPartyList();
      renderScreen();
    };
  </script>
</body>
</html>
